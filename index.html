    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('turkish-marathon-v1') || 'null')
        const premium = localStorage.getItem('turkuaz-edu-premium-theme') === 'true'
        const light = !premium && saved?.design === 'bosfor' && saved.dark === false
        document.documentElement.dataset.loadingTheme = premium ? 'premium' : light ? 'default' : 'night'
        document.querySelector('meta[name="theme-color"]').content = premium ? '#2f1414' : light ? '#eef3fb' : '#07142e'
      } catch { /* Storage may be unavailable on this device. */ }
    </script>
    <link rel="stylesheet" href="/src/app-loading.css" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
